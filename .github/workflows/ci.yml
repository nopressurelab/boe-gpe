name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Configuration and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate the JSON configuration
        run: python -m collector check

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Build the site from the data in the repository
        run: python -m collector build
