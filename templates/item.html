  <li class="item" data-source="{{source}}" data-topics="{{topic_ids}}" data-date="{{date}}">
    <p class="meta">
      <span class="badge src" title="{{source_name}}">{{source_short}}</span>
      <time datetime="{{date}}">{{date_label}}</time>
      <span class="region">{{region}}</span>
      <span class="score" title="Puntuación de relevancia">{{score}}</span>
    </p>
    <h2 class="title"><a href="{{url}}" rel="noopener">{{title}}</a></h2>
    <p class="org">{{org_line}}</p>
    <ul class="tags">{{tags}}</ul>
    <p class="links">{{links}}</p>
  </li>
